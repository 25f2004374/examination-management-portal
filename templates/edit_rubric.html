{% extends "base.html" %}
{% block title %}Edit Rubric | EMP{% endblock %}

{% block content %}
<h1 class="mb-4">Edit Rubric</h1>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Criteria Name</label>
                <input type="text" name="criterion_name" class="form-control" value="{{rubric.criterion_name}}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Maximum Marks</label>
                <input type="number" name="maximum_marks" class="form-control" value="{{rubric.maximum_marks}}" min="1" step="any" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Weightage</label>
                <input type="number" name="weightage" class="form-control" value="{{rubric.weightage}}" min="0" max="100" step="0.01" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" required>{{rubric.description or ''}}</textarea>
            </div>
            <button type="submit" class="btn btn-success">Update</button>
            <a href="{{ url_for('manage_rubrics', examination_id=rubric.examination_id) }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
